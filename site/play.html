<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Play &middot; Small Games</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <a class="logo" href="./">Small<span>Games</span></a>
    <nav>
      <a href="./#games">Games</a>
      <a href="./#suggest">Suggest a game</a>
    </nav>
  </header>

  <!-- One page plays every game: play.html?id=snake, play.html?id=flappy_bird ...
       play.js reads the id from the address bar and loads that game. -->
  <main class="player">
    <a class="back" href="./#games">&larr; All games</a>
    <h1 id="title">Loading&hellip;</h1>
    <p id="description" class="lede"></p>

    <!-- The game itself runs inside this iframe (a page inside a page) -->
    <div class="stage">
      <div class="frame" id="frame">
        <iframe id="game" title="Game" allow="fullscreen; autoplay; gamepad"></iframe>
      </div>
    </div>

    <div class="player-bar">
      <p class="hint">Click the game to start, then use your keyboard. Works best on a computer.</p>
      <button class="btn" id="fullscreen" type="button">Full screen</button>
    </div>

    <section class="controls">
      <h2>Controls</h2>
      <ul id="controls"></ul>
    </section>
  </main>

  <footer class="footer">
    <p>Built with Python, <a href="https://pyga.me">pygame-ce</a> and <a href="https://pypi.org/project/pygbag/">pygbag</a>.</p>
  </footer>

  <script src="play.js"></script>
</body>
</html>
